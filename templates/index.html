<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submission Review System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <h1 class="mb-4">Submission Review System</h1>
    <p class="text-muted mb-5">Please select your role:</p>
    <div class="row justify-content-center gap-4">
        <div class="col-md-4 card p-4 shadow-sm">
            <h3>Author</h3>
            <p class="text-muted">Create, edit, delete drafts and submit articles</p>
            <form action="/author" method="get">
                <input type="text" name="author_name" class="form-control mb-3" value="John Doe" placeholder="Enter author name" required>
                <button type="submit" class="btn btn-primary w-100">Enter Author Dashboard</button>
            </form>
        </div>
        <div class="col-md-4 card p-4 shadow-sm">
            <h3>Editor</h3>
            <p class="text-muted">Review pending submissions, approve or reject articles</p>
            <a href="/editor" class="btn btn-success w-100 mt-auto">Enter Editor Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
